[pytest]
# Root tests/ only holds fixtures/ (synthetic_sequences.py, characterization.json) —
# actual test suites live per-container and must be run independently
# (cd containers/<name> && pytest), since their same-named top-level modules
# (app, config, tests) are only safe to import in isolation. This scope keeps a
# bare `pytest` from the repo root from trying to collect every container's
# tests in one process.
testpaths = tests
addopts = -p no:cacheprovider
