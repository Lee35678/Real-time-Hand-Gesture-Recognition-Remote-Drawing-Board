# containers/vision-analysis 기본 설정.
#
# 우선순위: 환경변수 > config/vision-analysis.{APP_ENV}.yaml > 이 파일 > 코드 기본값.
# 값은 리팩토링 이전 app/config.py의 하드코딩 기본값과 동일하게 맞춰져 있다
# (Phase 1a: 구조만 이관, 동작 변경 없음 — refactoring.md 8절 금지사항 2).

app:
  env: dev

model:
  asset_path: models/hand_landmarker.task
  num_hands: 1
  min_hand_detection_confidence: 0.7
  min_hand_presence_confidence: 0.6
  min_tracking_confidence: 0.5
  delegate: CPU

pipeline:
  target_width: 640
  target_height: 480
  target_fps: 30.0
  enable_clahe: false
  outlier_scale_multiplier: 4.0
  near_edge_margin: 0.03
  egress_queue_max_size: 8
  drain_poll_timeout_sec: 0.5
  shutdown_join_timeout_sec: 2.0
  max_consecutive_malformed_frames: 30

one_euro:
  min_cutoff: 1.0
  beta: 0.3
  d_cutoff: 1.0

transport:
  ingest_host: 0.0.0.0
  ingest_port: 8760
  pattern_command_ws_url: ws://pattern-command:8761/landmarks
  egress_reconnect_min_delay: 0.5
  egress_reconnect_max_delay: 10.0
  egress_spool_max_events: 1000
  metrics_host: 0.0.0.0
  metrics_port: 8763

observability:
  metrics_window_size: 300
  palm_redetect_spike_ratio: 2.0

log_level: INFO
