services:
  web:
    build:
      context: .
      dockerfile: containers/web/Dockerfile
    ports:
      - "8000:8000"
    environment:
      VISION_ANALYSIS_WS_URL: ws://vision-analysis:8760/ingest/{session_id}
      SESSION_TOKEN: ${SESSION_TOKEN:-hand-board}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    depends_on:
      - vision-analysis

  canvas:
    build:
      context: .
      dockerfile: containers/canvas/Dockerfile
    ports:
      - "8762:8762"
    environment:
      WEB_CANVAS_OUTPUT_URL: ws://web:8000/ws/canvas-output/{session_id}

  vision-analysis:
    build:
      context: .
      dockerfile: containers/vision-analysis/Dockerfile
    ports:
      - "8760:8760" # ingest: Container A -> B (ws://vision-analysis:8760/ingest/{session_id})
      - "8763:8763" # /health, /metrics (8762는 canvas가 사용 중)
    environment:
      PATTERN_COMMAND_WS_URL: ws://pattern-command:8761/landmarks
    depends_on:
      - pattern-command

  pattern-command:
    build:
      context: .
      dockerfile: containers/pattern-command/Dockerfile
    environment:
      CANVAS_WS_URL: ws://canvas:8762/commands/{session_id}
